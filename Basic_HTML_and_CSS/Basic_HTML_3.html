<!DOCTYPE html>
<html lang="en">
    <head>
        <title>CSS Style Practice</title>
        <meta charset ="utf-8">
        <style>
            div{color:green;
            }

            .div2{
                color:darkslateblue;
            text-align:center;
        }
        </style>
    </head>
 <body>
    <h2>Creating section in HTMLwith DIV element</h2>
    <p>We are going to be creating a section in the webpage with the div container element</p>
    <div>
        <h3>This is a New Section</h3>
        <p>This is a new section of the webpage.</p>

    </div>

    <div class="div2">

    <h4>CSS color and alignment of text</h4>
    <p>This paragraph color is set to darkslateblue and aligned to the center</p>

</div>




</body>


</html>
